name: hermes-artifactbridge
version: 0.2.0.dev0
kind: standalone
description: >
  ArtifactBridge delegation plugin. During an ArtifactBridge A2A delegation the
  agent gets delegation-scoped ArtifactBridge tools (read the brief and Room,
  read/list/search documents in scope, contribute, upload images, create
  documents, propose changes). Each call forwards the delegation token from the
  task brief together with the runtime's service credential to the configured
  ArtifactBridge endpoint only. No personal ArtifactBridge login; contributions
  are attributed to the shared service.
author: Omnim
# Credential shown once at enrollment (Settings > Agent Sharing); tools URL defaults to production.
requires_env:
  - ARTIFACTBRIDGE_SERVICE_CREDENTIAL
provides_tools:
  - artifactbridge_delegation_read_brief
  - artifactbridge_delegation_read_room
  - artifactbridge_delegation_read_document
  - artifactbridge_delegation_list_documents
  - artifactbridge_delegation_search_documents
  - artifactbridge_delegation_contribute
  - artifactbridge_delegation_upload_image
  - artifactbridge_delegation_create_document
  - artifactbridge_delegation_propose_change
  - artifactbridge_read_space_context
  - artifactbridge_read_skill
# Pooled mode only (ARTIFACTBRIDGE_POOL_ENABLED=1 and the executor settings below): the plugin also registers
# the `artifactbridge-pool` platform and the token-free `artifactbridge_pool_*` variants of the eleven tools
# (toolset `artifactbridge-pool`). They are not listed above because an unconfigured install never registers them.
# Pooled routes and headers follow artifact-forge a26eb977 (cloud-contract-r2), not merged or deployed (see README).
# Coordinator profiles (settings.role: coordinator, see README "Coordinator profile") register none of the above:
# only artifactbridge_read_space_context, artifactbridge_read_document and artifactbridge_read_skill (toolset
# `ab_coordinator_reads`) and a confined override of Hermes' `session_search`, which needs tools.override.
capabilities:
  - tools.override
config_schema:
  role: {type: str, choices: [delegation, coordinator], default: delegation, description: "delegation: the delegation tools (default). coordinator: only the coordinator reads and a confined session_search."}
optional_env:
  - name: ARTIFACTBRIDGE_COORDINATOR_READ_CREDENTIAL
    description: "Coordinator profiles only: the coordinator's read installation credential (cri_...), shown once by ArtifactBridge."
    prompt: "ArtifactBridge coordinator read credential (coordinator profiles only, or empty)"
    password: true
  - name: ARTIFACTBRIDGE_POOL_ENABLED
    description: "Set to 1 to opt in to pooled (assignment-bound) execution, protocol v1. Off by default: its server routes are not deployed yet (see README)."
    prompt: "Enable ArtifactBridge pooled execution (1 or empty)"
    password: false
  - name: ARTIFACTBRIDGE_POOL_EXECUTOR_ID
    description: "This executor's UUID; pooled assignments for any other executor are refused."
    prompt: "ArtifactBridge pooled executor id (uuid)"
    password: false
  - name: ARTIFACTBRIDGE_POOL_CONNECTION_REVISION
    description: "This executor's connection revision (decimal string); assignments for another revision are refused."
    prompt: "ArtifactBridge pooled connection revision"
    password: false
  - name: ARTIFACTBRIDGE_POOL_PORT
    description: "Port for the separate artifactbridge-pool A2A listener (else platform extra.port, else 9901)."
    prompt: "ArtifactBridge pooled listener port (or empty)"
    password: false
# No Hermes hooks: the token rides in the task text and the tools are static.
provides_hooks: []
# pyproject.toml beside this manifest is what Hermes installs (it wins over this list); kept in sync.
python_dependencies:
  - "mcp>=2.0,<3"
  - "httpx2>=2.7,<3"
manifest_version: 2
license: MIT
homepage: https://github.com/omnim-ai/hermes-artifactbridge
tags: [artifactbridge, a2a, delegation, coordinator]
# Load gate only: exercised against a 0.21.3 source checkout; no released-version validation is claimed.
requires_hermes: ">=0.21.3"
